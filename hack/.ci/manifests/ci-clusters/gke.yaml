apiVersion: ci.scylladb.com/v1alpha1
kind: KubernetesCluster
metadata:
  # Filled in per run.
  name: ""
spec:
  credentialsSecret:
    # Filled in per run.
    name: ""
  version: "1.35"
  ttlSeconds: 14400
  type: GKE
  gke:
    location: us-central1
    nodePools:
    - name: workers
      locations:
      - us-central1-a
      config:
        machineType: e2-standard-8
        diskType: pd-standard
        diskSizeGB: 40
        labels:
          pool: workers
      initialNodeCount: 1
