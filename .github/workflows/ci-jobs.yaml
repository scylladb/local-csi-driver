name: CI jobs

on:
  workflow_call:

permissions:
  contents: read

# The default shell is `bash -e {0}`, which leaves pipefail unset, and it silently falls back to sh in an image
# without bash. Pinning it makes every step run under `bash --noprofile --norc -eo pipefail`, so a failing command
# in a pipeline fails the step, and an image missing bash fails loudly instead of running the steps under sh.
defaults:
  run:
    shell: bash

# actions/checkout clones as the runner user, but these container images declare no USER, so the jobs run as root
# and git refuses to operate on a tree it sees as foreign. safe.directory is only honoured from protected config
# scopes, and GIT_CONFIG_COUNT/KEY/VALUE is the environment form of the command scope, so this covers every git
# invocation in the job - including the ones make shells out to - without a step in each job.
# GIT_CONFIG_COUNT is a single shared counter: anything else setting it would overwrite these rather than append.
env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    container:
      image: quay.io/scylladb/scylla-operator-images:golang-1.26
    timeout-minutes: 30
    steps:
      # GIT_TAG and GIT_TAG_SHORT run `git describe --tags` at Makefile parse time and error out when it fails, so
      # the tags have to be present. A default shallow checkout fetches none.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build
        run: make --warn-undefined-variables build

  unit:
    name: unit
    runs-on: ubuntu-latest
    container:
      image: quay.io/scylladb/scylla-operator-images:golang-1.26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run unit tests
        run: make --warn-undefined-variables test-unit

  verify:
    name: verify
    runs-on: ubuntu-latest
    container:
      image: quay.io/scylladb/scylla-operator-images:golang-1.26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify
        run: make --warn-undefined-variables verify

  verify-deps:
    name: verify-deps
    runs-on: ubuntu-latest
    container:
      image: quay.io/scylladb/scylla-operator-images:golang-1.26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify dependencies
        run: make --warn-undefined-variables verify-deps

