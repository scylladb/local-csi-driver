name: PR

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/_checks.yaml

  detect-source-changes:
    name: detect-source-changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      source-changed: ${{ steps.source-change-detection.outputs.source }}
    steps:
      - name: Detect source changes
        id: source-change-detection
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # With 'every', a changed file counts only when it matches all rules, i.e. escapes every exclusion.
          predicate-quantifier: every
          filters: |
            source:
              - '!**/OWNERS'
              - '!OWNERS_ALIASES'
              - '!**/*.md'
              - '!renovate.json'

  image:
    needs: detect-source-changes
    if: needs.detect-source-changes.outputs.source-changed == 'true'
    uses: ./.github/workflows/_image.yaml
    with:
      image-tag: ${{ github.run_id }}
    secrets:
      registry-auth-json: ${{ secrets.QUAY_SCYLLADB_DEV_PR_PUBLISHER_CREDS }}

  e2e:
    needs: image
    uses: ./.github/workflows/_e2e-jobs.yaml
    with:
      image-ref: ${{ needs.image.outputs.image-ref }}
      tests-image-ref: ${{ needs.image.outputs.tests-image-ref }}
    secrets:
      ci-provisioners-kubeconfig: ${{ secrets.CI_PROVISIONERS_KUBECONFIG }}

  verify-commits:
    name: verify-commits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Without this, the checkout is refs/pull/N/merge, GitHub's test merge of the PR into the
          # base branch, so HEAD is a merge commit that the contributor never wrote.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify commits
        uses: scylladb/scylla-operator/.github/actions/verify-commits@8622d9636308f9f9e4fb778ed2c73db1ea4dfb42 # master

  # The merge automation gates on a fixed set of contexts it is configured with, so individual GitHub Actions
  # checks are invisible to it. This aggregate is the single context it can be told to require, which keeps
  # wiring further jobs into the merge gate a one-line change here.
  check-required:
    runs-on: ubuntu-latest
    needs:
    - checks
    - detect-source-changes
    - image
    - e2e
    - verify-commits
    if: always()
    steps:
    - name: Check the required jobs
      uses: scylladb/scylla-operator/.github/actions/check-needs@b309bb70a9731a20b74a2bf69e2f8100df96c80e # TODO: repin to master once scylladb/scylla-operator#3814 merges
      with:
        needs: ${{ toJSON(needs) }}
